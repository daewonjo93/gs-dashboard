<title>굿어스스마트솔루션 경영실적 대시보드</title>
<style>
  @font-face {
    font-family: 'DashMono';
    src: local('SF Mono'), local('Consolas');
  }

  :root {
    --bg: #EAF0EE;
    --surface: #FFFFFF;
    --surface-2: #F3F7F5;
    --surface-3: #E7EEEC;
    --border: #D7E2DE;
    --border-strong: #BFCFCA;
    --ink-900: #10262B;
    --ink-700: #38504F;
    --ink-500: #62807D;
    --ink-400: #85A19D;
    --accent: #B75B22;
    --accent-ink: #7A3D16;
    --accent-soft: #F3E0CE;
    --accent-2: #2E6E86;
    --accent-2-soft: #DCEBEF;
    --good: #2C8C56;
    --good-soft: #DCEFE1;
    --warn: #B4801C;
    --warn-soft: #F5E9CC;
    --bad: #BD4234;
    --bad-soft: #F6DFDA;
    --shadow: 0 1px 2px rgba(16,38,43,0.06), 0 8px 24px -12px rgba(16,38,43,0.18);
    --font-sans: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    --font-num: 'DashMono', 'SF Mono', Consolas, 'Roboto Mono', monospace;
    --logo-chip-bg: transparent;
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0A1416;
      --surface: #12201F;
      --surface-2: #172625;
      --surface-3: #1D2E2C;
      --border: #24373533;
      --border: #29403D;
      --border-strong: #365551;
      --ink-900: #EAF3F1;
      --ink-700: #BCD2CD;
      --ink-500: #85A19D;
      --ink-400: #63807C;
      --accent: #E08A44;
      --accent-ink: #F4C79A;
      --accent-soft: #3A2A19;
      --accent-2: #6BB2CC;
      --accent-2-soft: #1B333B;
      --good: #4FBE7E;
      --good-soft: #163127;
      --warn: #E3B248;
      --warn-soft: #362A11;
      --bad: #E67E70;
      --bad-soft: #3A1E1B;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
      --logo-chip-bg: #FFFFFF;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0A1416; --surface: #12201F; --surface-2: #172625; --surface-3: #1D2E2C;
    --border: #29403D; --border-strong: #365551;
    --ink-900: #EAF3F1; --ink-700: #BCD2CD; --ink-500: #85A19D; --ink-400: #63807C;
    --accent: #E08A44; --accent-ink: #F4C79A; --accent-soft: #3A2A19;
    --accent-2: #6BB2CC; --accent-2-soft: #1B333B;
    --good: #4FBE7E; --good-soft: #163127; --warn: #E3B248; --warn-soft: #362A11;
    --bad: #E67E70; --bad-soft: #3A1E1B;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 12px 28px -14px rgba(0,0,0,0.6);
    --logo-chip-bg: #FFFFFF;
  }
  :root[data-theme="light"] {
    --bg: #EAF0EE; --surface: #FFFFFF; --surface-2: #F3F7F5; --surface-3: #E7EEEC;
    --border: #D7E2DE; --border-strong: #BFCFCA;
    --ink-900: #10262B; --ink-700: #38504F; --ink-500: #62807D; --ink-400: #85A19D;
    --accent: #B75B22; --accent-ink: #7A3D16; --accent-soft: #F3E0CE;
    --accent-2: #2E6E86; --accent-2-soft: #DCEBEF;
    --good: #2C8C56; --good-soft: #DCEFE1; --warn: #B4801C; --warn-soft: #F5E9CC;
    --bad: #BD4234; --bad-soft: #F6DFDA;
    --shadow: 0 1px 2px rgba(16,38,43,0.06), 0 8px 24px -12px rgba(16,38,43,0.18);
    --logo-chip-bg: transparent;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html { overflow-y: scroll; } /* 세로 스크롤바 자리를 항상 확보 — 펀넬 시뮬레이션처럼 스크롤이 없는 짧은 페이지로 전환될 때 스크롤바가 사라지면서 본문 폭이 흔들리는 걸 방지 */
  body {
    background: var(--bg);
    color: var(--ink-900);
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 1180px; margin: 0 auto; padding: 28px 20px 64px; }

  /* ---------- Header ---------- */
  header.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .titleblock .brand-logo-wrap { display: inline-block; margin-bottom: 8px; padding: 6px 10px; border-radius: 8px; background: var(--logo-chip-bg); transition: background .15s; }
  .titleblock .brand-logo { display: block; height: 26px; width: auto; }
  .titleblock h1 { font-size: 24px; font-weight: 800; margin: 0 0 4px; letter-spacing: -0.01em; text-wrap: balance; color: var(--ink-900); }
  .titleblock .sub { font-size: 13px; color: var(--ink-500); }
  .data-source { margin-top: 32px; padding-top: 14px; border-top: 1px solid var(--border); font-size: 10.5px; color: var(--ink-400); text-align: center; }
  .top-right { display: flex; align-items: flex-end; gap: 14px; }

  /* ---------- Theme toggle ---------- */
  .theme-toggle {
    appearance: none; display: inline-flex; align-items: center; gap: 7px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 7px 12px 7px 7px; cursor: pointer; font-family: var(--font-sans);
    font-size: 12px; font-weight: 600; color: var(--ink-700); box-shadow: var(--shadow);
    flex-shrink: 0;
  }
  .theme-toggle:hover { border-color: var(--border-strong); }
  .theme-toggle:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 2px; }
  .theme-toggle .icon-wrap {
    width: 22px; height: 22px; border-radius: 50%; display: flex; align-items: center; justify-content: center;
    background: var(--accent-soft); color: var(--accent-ink);
  }
  .theme-toggle .icon-wrap svg { width: 13px; height: 13px; }

  /* ---------- Tabs ---------- */
  nav.tabs {
    display: flex; gap: 4px; padding: 4px; background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 12px; margin-bottom: 22px;
    overflow-x: auto;
  }
  nav.tabs button {
    appearance: none; border: none; background: transparent; cursor: pointer;
    font-family: var(--font-sans); font-size: 13.5px; font-weight: 600; color: var(--ink-500);
    padding: 9px 16px; border-radius: 9px; white-space: nowrap; transition: background .15s, color .15s;
  }
  nav.tabs button:hover { color: var(--ink-900); }
  nav.tabs button.active { background: var(--surface); color: var(--accent-ink); box-shadow: var(--shadow); }
  nav.tabs button:focus-visible { outline: 2px solid var(--accent-2); outline-offset: 1px; }
  nav.tabs button .unit-tag { font-size: 10.5px; font-weight: 700; opacity: 0.6; margin-left: 3px; }
  nav.page-switch { margin-bottom: 10px; background: var(--surface-3); }
  nav.page-switch button { font-size: 14px; }
  nav.page-switch button.active { background: var(--accent-2); color: #FFFFFF; }

  /* ---------- Section headings ---------- */
  .panel-title { display: flex; align-items: baseline; gap: 10px; margin: 30px 0 12px; }
  .panel-title h2 { font-size: 15px; font-weight: 700; margin: 0; color: var(--ink-900); }
  .panel-title .hint { font-size: 12px; color: var(--ink-500); }
  .panel-title::after { content: ""; flex: 1; height: 1px; background: var(--border); order: 1; }
  .panel-title-action { order: 2; }

  /* ---------- KPI hero cards ---------- */
  .kpi-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .kpi-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px 18px 16px; box-shadow: var(--shadow); position: relative;
    display: flex; flex-direction: column; gap: 10px;
  }
  .kpi-head { display: flex; justify-content: space-between; align-items: flex-start; }
  .kpi-label { font-size: 12.5px; font-weight: 700; color: var(--ink-700); }
  .kpi-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; padding: 3px 9px; border-radius: 999px; }
  .kpi-badge.good { background: var(--good-soft); color: var(--good); }
  .kpi-badge.warn { background: var(--warn-soft); color: var(--warn); }
  .kpi-badge.bad { background: var(--bad-soft); color: var(--bad); }
  .kpi-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

  .kpi-body { display: flex; align-items: center; gap: 16px; }
  .kpi-num { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-size: 30px; font-weight: 700; letter-spacing: -0.01em; color: var(--ink-900); }
  .kpi-num.neg { color: var(--bad); }
  .kpi-unit { font-size: 13px; font-weight: 600; color: var(--ink-500); margin-left: 2px; }
  .kpi-sub { font-size: 12px; color: var(--ink-500); margin-top: -4px; }
  .kpi-sub b { color: var(--ink-700); font-weight: 700; font-variant-numeric: tabular-nums; }

  .gauge { flex-shrink: 0; }
  .gauge svg { display: block; }
  .gauge-pct { font-family: var(--font-num); font-size: 13px; font-weight: 700; }

  .kpi-stats { display: flex; flex-direction: row; flex-wrap: wrap; gap: 18px 20px; flex: 1; }
  .stat-row { display: flex; flex-direction: column; align-items: flex-start; gap: 5px; flex: 0 0 80px; }
  .stat-row .l { color: var(--ink-500); font-size: 13.5px; font-weight: 600; }
  .stat-row .v { font-family: var(--font-num); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -0.01em; white-space: nowrap; }
  .kpi-foot { display: flex; gap: 14px; padding-top: 10px; border-top: 1px dashed var(--border); font-size: 13px; }
  .kpi-foot .item { display: flex; flex-direction: column; gap: 3px; flex: 1 1 0; min-width: 0; }
  .kpi-foot .item .l { color: var(--ink-500); }
  .kpi-foot .item .v { font-family: var(--font-num); font-size: 15px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .v.up { color: var(--good); } .v.down { color: var(--bad); } .v.flat { color: var(--ink-700); }

  /* ---------- Comparison table ---------- */
  .table-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; }
  .table-scroll { overflow-x: auto; }
  table.cmp { width: 100%; border-collapse: collapse; min-width: 640px; table-layout: fixed; }
  table.cmp th:first-child, table.cmp td:first-child { width: 16%; }
  table.cmp th:not(:first-child), table.cmp td:not(:first-child) { width: 16.8%; }
  table.cmp th, table.cmp td { padding: 10px 14px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.cmp th:first-child, table.cmp td:first-child { text-align: left; }
  table.cmp thead th { font-size: 11px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--ink-500); font-weight: 700; background: var(--surface-2); }
  table.cmp thead th.grp { text-align: center; }
  table.cmp tbody tr:last-child td { border-bottom: none; }
  table.cmp tbody tr:hover { background: var(--surface-2); }
  table.cmp td.metric { font-size: 12px; font-weight: 400; color: var(--ink-500); }
  table.cmp td.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; color: var(--ink-700); }
  table.cmp td.num.strong { color: var(--ink-900); font-weight: 700; }
  table.cmp td.num.neg { color: var(--bad); }
  .delta { font-family: var(--font-num); font-variant-numeric: tabular-nums; font-weight: 700; }
  .delta.up { color: var(--good); } .delta.down { color: var(--bad); } .delta.flat { color: var(--ink-500); }
  .delta .arrow { font-size: 10px; }

  /* ---------- Monthly outlook ---------- */
  .month-grid { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x proximity; padding-bottom: 6px; scroll-padding-left: 0; }
  .month-card { flex: 0 0 calc((100% - 24px) / 3); scroll-snap-align: start; background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); }
  .month-card .m-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
  .month-card .m-name { font-size: 13px; font-weight: 800; color: var(--ink-900); }
  .month-card .m-kind { font-size: 10.5px; font-weight: 700; padding: 2px 8px; border-radius: 999px; }
  .month-card .m-kind.actual { background: var(--accent-2-soft); color: var(--accent-2); }
  .month-card .m-kind.forecast { background: var(--warn-soft); color: var(--warn); }
  .month-card .m-kind.plan { background: var(--surface-3); color: var(--ink-500); }
  .m-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-top: 1px solid var(--border); margin: 0 -8px; padding-left: 8px; padding-right: 8px; border-radius: 6px; }
  .m-row:first-of-type { border-top: none; }
  .m-row .m-label { font-size: 12px; color: var(--ink-500); }
  .m-row .m-val { font-family: var(--font-num); font-size: 13.5px; font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-900); }
  .m-row .m-val.neg { color: var(--bad); }
  .m-row.clickable { cursor: pointer; }
  .m-row.clickable:hover { background: var(--surface-2); }
  .m-row.clickable:hover .m-label,
  .m-row.clickable:hover .m-val:not(.neg) { color: var(--accent-2); }
  .m-row.clickable .m-val { text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: var(--ink-400); }
  .m-row.clickable:hover .m-val { text-decoration-color: var(--accent-2); }
  .cmp-cum-drill { cursor: pointer; text-decoration: underline dotted; text-underline-offset: 3px; text-decoration-color: var(--ink-400); }
  .cmp-cum-drill:hover { color: var(--accent-2); text-decoration-color: var(--accent-2); }
  .bar-track { position: relative; height: 4px; background: var(--surface-3); border-radius: 3px; margin-top: 4px; overflow: hidden; }
  .bar-fill { position: absolute; inset: 0 auto 0 0; background: var(--accent-2); border-radius: 3px; }

  /* ---------- Project drilldown modal ---------- */
  .modal-overlay { position: fixed; inset: 0; background: rgba(6,14,16,0.6); z-index: 1000; display: none; align-items: flex-start; justify-content: center; padding: 6vh 16px; overflow-y: auto; }
  .modal-overlay.open { display: flex; }
  .modal-box { background: var(--surface); border-radius: 16px; border: 1px solid var(--border); box-shadow: var(--shadow); width: 100%; max-width: 640px; max-height: 86vh; display: flex; flex-direction: column; overflow: hidden; }
  .modal-head { display: flex; justify-content: space-between; align-items: flex-start; padding: 18px 20px 14px; border-bottom: 1px solid var(--border); gap: 12px; }
  .modal-head h3 { margin: 0 0 4px; font-size: 16px; font-weight: 800; color: var(--ink-900); }
  .modal-head .modal-sub { font-size: 12px; color: var(--ink-500); }
  .modal-close { appearance: none; border: none; background: var(--surface-3); color: var(--ink-700); width: 28px; height: 28px; border-radius: 50%; cursor: pointer; font-size: 15px; line-height: 1; flex-shrink: 0; }
  .modal-close:hover { background: var(--border-strong); }
  .modal-body { overflow-y: auto; padding: 0; }
  .modal-empty { padding: 32px 20px; text-align: center; color: var(--ink-500); font-size: 13px; }
  .month-filter { display: flex; gap: 6px; padding: 12px 20px; border-bottom: 1px solid var(--border); flex-wrap: wrap; position: sticky; top: 0; background: var(--surface); z-index: 1; }
  .week-filter-wrap { display: flex; align-items: center; gap: 8px; margin-bottom: 14px; }
  .week-filter-scroll { display: flex; gap: 6px; flex: 1; overflow-x: auto; scroll-behavior: smooth; scrollbar-width: none; }
  .week-filter-scroll::-webkit-scrollbar { display: none; }
  .week-filter-scroll .month-filter-btn { flex-shrink: 0; white-space: nowrap; }
  .week-filter-arrow {
    flex-shrink: 0; width: 30px; height: 30px; border-radius: 50%; appearance: none;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink-700);
    box-shadow: var(--shadow); cursor: pointer; font-size: 15px; line-height: 1;
    display: flex; align-items: center; justify-content: center;
  }
  .week-filter-arrow:hover { border-color: var(--border-strong); color: var(--accent-2); }
  .month-filter-btn { appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-500); font-family: var(--font-sans); font-size: 12px; font-weight: 700; padding: 5px 12px; border-radius: 999px; cursor: pointer; }
  .month-filter-btn:hover { border-color: var(--border-strong); color: var(--ink-900); }
  .month-filter-btn.active { background: var(--accent-2); border-color: var(--accent-2); color: #FFFFFF; }
  table.proj { width: 100%; border-collapse: collapse; }
  table.proj th { background: var(--surface); font-size: 10.5px; text-transform: uppercase; letter-spacing: 0.03em; color: var(--ink-500); font-weight: 700; text-align: left; padding: 12px 20px 6px; border-bottom: 1px solid var(--border); white-space: nowrap; }
  table.proj th.num, table.proj td.num { text-align: right; }
  table.proj th.status, table.proj td.status { text-align: right; white-space: nowrap; }
  table.proj.exec-table { table-layout: fixed; }
  table.proj.exec-table th:first-child, table.proj.exec-table td:first-child { width: 260px; }
  table.proj.exec-table th.status, table.proj.exec-table td.status { width: 72px; }
  table.proj.exec-table th.type, table.proj.exec-table td.type { width: 56px; text-align: left; white-space: nowrap; }
  table.proj.exec-table th.note, table.proj.exec-table td.note { width: 180px; text-align: left; white-space: normal; color: var(--ink-500); font-size: 12px; }
  table.proj.exec-table th.num, table.proj.exec-table td.num { width: 72px; }
  table.proj td { padding: 9px 20px; border-bottom: 1px solid var(--border); font-size: 12.5px; vertical-align: top; }
  table.proj tr:last-child td { border-bottom: none; }
  table.proj tfoot td { font-weight: 800; color: var(--ink-900); background: var(--surface-2); border-top: 2px solid var(--border-strong); border-bottom: none; }
  tr.proj-clickable { cursor: pointer; }
  tr.proj-clickable:hover td { background: var(--surface-2); }
  tr.proj-clickable:hover .pname { color: var(--accent-2); }

  /* ---------- 진행상황 편집 모달 ---------- */
  .progress-form { padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .progress-week { display: flex; flex-direction: column; gap: 6px; }
  .progress-week label { font-size: 12px; font-weight: 700; color: var(--ink-500); }
  .progress-week textarea {
    font-family: var(--font-sans); font-size: 13px; color: var(--ink-900); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; resize: vertical; min-height: 44px;
  }
  .progress-week textarea:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; border-color: var(--accent-2); }
  .progress-week input[type="text"], .progress-week input[type="number"], .progress-week input[type="month"], .progress-week select {
    font-family: var(--font-sans); font-size: 13px; color: var(--ink-900); background: var(--surface-2);
    border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px;
  }
  .progress-week select { appearance: auto; cursor: pointer; }
  .progress-week input:focus, .progress-week select:focus { outline: 2px solid var(--accent-2); outline-offset: 1px; border-color: var(--accent-2); }
  .req { color: var(--bad); margin-left: 2px; }
  .timing-range { display: flex; align-items: center; gap: 6px; }
  .timing-range input[type="month"] { flex: 1; min-width: 0; }
  .timing-range span { color: var(--ink-500); font-size: 12px; flex-shrink: 0; }

  /* ---------- 주간업무보고 ---------- */
  .week-form-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 18px 20px; display: flex; flex-direction: column; gap: 14px; }
  .week-form-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; }
  .week-list { display: flex; flex-direction: column; gap: 12px; }
  .week-card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); padding: 16px 18px; }
  .week-card-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; margin-bottom: 6px; }
  .week-badge { font-size: 11px; font-weight: 700; color: var(--accent-2); background: var(--accent-2-soft); padding: 3px 9px; border-radius: 999px; margin-right: 8px; }
  .week-range { font-size: 11.5px; color: var(--ink-500); font-family: var(--font-num); flex-shrink: 0; }
  .week-pname { font-size: 14.5px; font-weight: 700; color: var(--ink-900); }
  .week-meta { font-size: 12px; color: var(--ink-500); margin-top: 2px; }
  .week-field { margin-top: 10px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .week-field b { display: block; font-size: 11px; font-weight: 700; color: var(--ink-500); margin-bottom: 3px; }
  .week-field p { margin: 0; font-size: 12.5px; color: var(--ink-700); white-space: pre-line; }
  .week-card-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; padding-top: 10px; border-top: 1px dashed var(--border); }
  .week-card-btn {
    appearance: none; border: 1px solid var(--border); background: var(--surface-2); color: var(--ink-500); font-family: var(--font-sans);
    font-size: 11.5px; font-weight: 700; padding: 4px 12px; border-radius: 8px; cursor: pointer;
  }
  .week-card-btn:hover { border-color: var(--border-strong); color: var(--ink-700); }
  .week-card-btn.danger:hover { border-color: var(--bad); color: var(--bad); }
  @media (max-width: 860px) { .week-form-grid { grid-template-columns: 1fr; } }
  .progress-actions { display: flex; justify-content: flex-end; gap: 8px; align-items: center; }
  .progress-status { font-size: 12px; color: var(--ink-500); margin-right: auto; }
  .progress-status.err { color: var(--bad); }
  .progress-status.ok { color: var(--good); }
  .btn-save {
    appearance: none; border: none; background: var(--accent-2); color: #FFFFFF; font-family: var(--font-sans);
    font-size: 13px; font-weight: 700; padding: 9px 18px; border-radius: 8px; cursor: pointer;
  }
  .btn-save:hover { opacity: 0.9; }
  .btn-save:disabled { opacity: 0.5; cursor: default; }
  .btn-cancel {
    appearance: none; border: 1px solid var(--border); background: var(--surface); color: var(--ink-700); font-family: var(--font-sans);
    font-size: 13px; font-weight: 700; padding: 9px 16px; border-radius: 8px; cursor: pointer;
  }
  .btn-cancel:hover { border-color: var(--border-strong); }
  table.proj td.pname { font-weight: 700; color: var(--ink-900); }
  table.proj td.pmeta { color: var(--ink-500); font-size: 11.5px; margin-top: 2px; }
  table.proj td.pamt { font-family: var(--font-num); font-weight: 700; font-variant-numeric: tabular-nums; color: var(--ink-900); white-space: nowrap; }
  .proj-badge { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 999px; margin-top: 4px; white-space: nowrap; }
  .proj-badge.won { background: var(--good-soft); color: var(--good); }
  .proj-badge.pipeline { background: var(--warn-soft); color: var(--warn); }
  .proj-badge.bad { background: var(--bad-soft); color: var(--bad); }
  .modal-foot { padding: 12px 20px; border-top: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--ink-500); background: var(--surface-2); }
  .modal-foot b { color: var(--ink-900); font-family: var(--font-num); font-size: 13px; }

  /* ---------- Status strip ---------- */
  .status-strip { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; }
  .status-chip { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 4px; }
  .status-chip.cmp-cum-drill { text-decoration: none; }
  .status-chip.cmp-cum-drill:hover { color: inherit; border-color: var(--accent-2); }
  .status-chip .s-label { font-size: 11.5px; color: var(--ink-500); font-weight: 600; }
  .status-chip .s-val { font-family: var(--font-num); font-size: 20px; font-weight: 800; color: var(--ink-900); }


  @media (max-width: 860px) {
    .kpi-row { grid-template-columns: 1fr; }
    .month-card { flex-basis: calc(100% - 40px); }
    .status-strip { grid-template-columns: 1fr; }
  }

</style>

<script>
const EOK = "억"; // 단위: 억원

// ---------- 구글시트 실시간 연동 ----------
// 마감월(현재 몇 월까지의 누계인지). 다음 달로 갱신할 때 이 값만 바꾸면 됨.
const CLOSING_MONTH = 7;
// "월별 실행계획" 메뉴가 보는 달. 매주 사용자가 구글시트의 "[N]월 계획 및 현황_수주/매출" 탭 내용을
// 최신 파일로 갈아끼워주면(탭 이름은 고정하지 않고 매월 새로 맞춤) 이 값도 함께 바꿔야 함.
const EXEC_MONTH = 8;

// 구글시트를 브라우저가 직접 열람(gviz)하지 않고 Apps Script를 거쳐서 읽음 — 시트 ID가 클라이언트 코드에 노출되지 않게
// 하기 위함(2026-08-21, 시트 비공개 전환과 함께 적용). Apps Script의 doGet이 gviz와 동일한 모양의 JSON을 만들어 돌려줌.
function gvizUrl(sheetName, range) {
  const params = new URLSearchParams({ sheet: sheetName });
  if (range) params.set("range", range);
  return `${PROGRESS_WEBHOOK_URL}?${params.toString()}`;
}

async function fetchGrid(sheetName, range) {
  const res = await fetch(gvizUrl(sheetName, range));
  if (!res.ok) throw new Error(`시트를 불러오지 못했습니다: ${sheetName}`);
  const text = await res.text();
  const jsonStr = text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1);
  const obj = JSON.parse(jsonStr);
  return obj.table.rows.map(r => (r.c || []).map(cell => (cell ? cell.v : null)));
}

const BIZ_UNITS = [
  { key: "all", label: "전사", tag: "종합", biz: null },
  { key: "infra", label: "인프라사업부", tag: "", biz: "인프라사업팀" },
  { key: "fa", label: "FA사업팀", tag: "", biz: "FA사업팀" },
  { key: "strategy", label: "전략·대외사업팀", tag: "", biz: "전략/대외사업팀" },
  { key: "strategybu", label: "전략사업부", tag: "", biz: ["FA사업팀", "전략/대외사업팀"] }, // FA+전략/대외 합산 (GS 시트의 숨은 5번째 블록)
];

function bizMatch(biz, filter) {
  if (!filter) return true;
  if (Array.isArray(filter)) return filter.includes(biz);
  return biz === filter;
}

// GS 시트 블록 내 행 오프셋(수주 행 기준 +n). goodus_dashboard_gs_sheet_formulas 메모리 참고.
const OFFSETS = {
  수주: 0, 매출: 1, 재료비: 6, 매출이익: 11, 기술직접원가: 12, 직접경비: 13,
  영업OPEX: 17, 기술OPEX간접비용: 22, 공헌이익: 25, 공통비: 26, 영업이익: 27,
};

function stripSpaces(v) { return (v == null ? "" : String(v)).replace(/\s+/g, ""); }

// 시트 숫자 칸이 실수로 텍스트(쉼표 포함 "100,000,000" 등)로 입력된 경우에도 안전하게 파싱.
// Number()는 쉼표 섞인 문자열을 NaN으로 처리해 조용히 0으로 사라지는 버그가 있었음(2026-08-19, 펀넬리스트 11월 매출 누락 사례).
function toNum(v) {
  if (v == null) return 0;
  if (typeof v === "number") return v;
  const n = Number(String(v).replace(/,/g, "").trim());
  return isNaN(n) ? 0 : n;
}

// 수정 폼에 기존 값을 되채울 때 따옴표/꺾쇠가 HTML을 깨뜨리지 않도록.
function escAttr(v) {
  return String(v == null ? "" : v).replace(/&/g, "&amp;").replace(/"/g, "&quot;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

// GS 시트에서 "수주" 라벨이 있는 행을 순서대로 찾아 4개 블록(전사/인프라/FA/전략) 시작행을 얻는다.
// 절대 행 번호 대신 라벨로 찾는 이유: 시트에 행이 추가/삭제돼도 안전하게 동작하도록.
function findGSBlockStarts(gsGrid) {
  const idxs = [];
  // 5번째 "수주" 행은 GS 시트 자체가 갖고 있는 숨은 롤업 블록(FA사업팀+전략/대외사업팀 합산) — 전략사업부 탭에 사용.
  for (let i = 0; i < gsGrid.length && idxs.length < 5; i++) {
    if (stripSpaces(gsGrid[i][1]) === "수주") idxs.push(i);
  }
  if (idxs.length < 4) throw new Error("GS 시트 구조를 인식할 수 없습니다 (수주 행 4개를 찾지 못함)");
  return idxs;
}

function extractGSRow(gsGrid, baseIdx, metricKey) {
  const row = gsGrid[baseIdx + OFFSETS[metricKey]] || [];
  const target = toNum(row[4]); // E열 = 연간계획
  const months = [];
  for (let m = 6; m <= 17; m++) months.push(toNum(row[m])); // G~R = 1~12월
  return { target, months };
}

function sumRange(arr, fromIdx, toIdx) {
  let s = 0;
  for (let i = fromIdx; i <= toIdx; i++) s += arr[i] || 0;
  return s;
}

function periodize(target, months) {
  const M = CLOSING_MONTH;
  // 원(raw) -> 억 단위 변환. GS 셀/원장 금액은 모두 raw 원이므로 여기서 한 번에 나눈다.
  return {
    target: target / 1e8,
    cum: sumRange(months, 0, M - 1) / 1e8,
    annual: sumRange(months, 0, 11) / 1e8,
    jul: (months[M - 1] || 0) / 1e8,
    aug: (months[M] || 0) / 1e8,
    remain: sumRange(months, M + 1, 11) / 1e8,
  };
}

// 진행(계약)_리스트: 헤더행("계약월")을 찾아 데이터 시작 위치를 얻는다(헤더 다음다음 행부터, 합계행 1개 건너뜀).
function findWonDataStart(grid) {
  // "계약월" 헤더 라벨이 시트 버전에 따라 비어있을 수 있어(2026-08-14 확인),
  // 항상 존재하는 합계행의 "합계"(프로젝트명 열) 위치로 찾는다.
  for (let i = 0; i < grid.length; i++) {
    if (stripSpaces(grid[i][6]) === "합계") return i + 1;
  }
  throw new Error("진행(계약)_리스트 구조를 인식할 수 없습니다 (헤더 행을 찾지 못함)");
}
// 사전(펀넬)_리스트: "합계" 라벨이 있는 행 다음부터 데이터 시작.
function findPipeDataStart(grid) {
  for (let i = 0; i < grid.length; i++) {
    if (stripSpaces(grid[i][8]) === "합계") return i + 1;
  }
  throw new Error("사전(펀넬)_리스트 구조를 인식할 수 없습니다 (합계 행을 찾지 못함)");
}

// A=사업부명, B=계약월, E=당해재료비율, G=프로젝트명, J=영업대표, K=매출처명, O=계약금액, R:AC=1~12월 매출인식
function buildWonList(grid, dataStart) {
  const rows = [];
  for (let i = dataStart; i < grid.length; i++) {
    const r = grid[i];
    const biz = stripSpaces(r[0]) ? String(r[0]).trim() : "";
    if (!biz) continue;
    const months = [];
    for (let c = 17; c <= 28; c++) months.push(toNum(r[c]));
    rows.push([biz, r[6], r[10], r[9], String(r[1] || "").trim(), toNum(r[14]), ...months, toNum(r[4])]); // 마지막 = E열 당해재료비율(0~1)
  }
  return rows;
}
// A=사업부명, B=계약월, C=수주확도 적용, G=재료비율, H=프로젝트명, K=영업대표, L=매출처명, R=예상수주확률, S=프로젝트상태, V:AG=1~12월
// 2026-08-14: 새 시트에서 "수주확도 적용" 상태 열이 추가되며 C열 이후 전체가 +1 밀림 —
// A=사업부명, B=계약월, D=수주확도 적용(금액), G=재료비율, I=프로젝트명, L=영업대표, M=매출처명, S=예상수주확률, T=프로젝트상태, W:AH=1~12월 매출인식
function buildPipelineList(grid, dataStart) {
  const rows = [];
  for (let i = dataStart; i < grid.length; i++) {
    const r = grid[i];
    const biz = stripSpaces(r[0]) ? String(r[0]).trim() : "";
    if (!biz) continue;
    const months = [];
    for (let c = 22; c <= 33; c++) months.push(toNum(r[c]));
    const prob = r[18] != null ? Math.round(toNum(r[18]) * 100) + "%" : "";
    const applied = stripSpaces(r[2]); // C열 = 수주확도 적용 여부("적용"/"-")
    rows.push([biz, r[8], r[12], r[11], String(r[1] || "").trim(), toNum(r[3]), prob, (r[19] || "").toString().trim(), ...months, toNum(r[34]), applied, toNum(r[6])]); // 마지막 3개 = AI열 매출 당해합계, C열 적용여부, G열 재료비율(0~1)
  }
  return rows;
}

function sumBacklogRevenue(wonGrid, dataStart, bizFilter) {
  const M = CLOSING_MONTH;
  let s = 0;
  for (let i = dataStart; i < wonGrid.length; i++) {
    const r = wonGrid[i];
    const biz = stripSpaces(r[0]) ? String(r[0]).trim() : "";
    if (!biz) continue;
    if (!bizMatch(biz, bizFilter)) continue;
    for (let c = 17 + M; c <= 28; c++) s += toNum(r[c]); // (마감월+1)월~12월 매출인식
  }
  return s;
}
// 펀넬 매출(연간목표) = C열(수주확도 적용)이 "적용"인 프로젝트만, AI열(매출 당해합계) 합산 (2026-08-14, 사용자 확인)
function sumFunnelTarget(pipeGrid, dataStart, bizFilter) {
  let s = 0;
  for (let i = dataStart; i < pipeGrid.length; i++) {
    const r = pipeGrid[i];
    const biz = stripSpaces(r[0]) ? String(r[0]).trim() : "";
    if (!biz) continue;
    if (!bizMatch(biz, bizFilter)) continue;
    if (toNum(r[18]) < 0.5) continue; // S = 예상수주확률, 50% 미만 제외(C열 "적용" 기준과 동일 — 2026-08-21 확인)
    s += toNum(r[34]); // AI = 매출 당해합계
  }
  return s;
}

// ---------- 월별 실행계획 (주간 실적 리뷰 자료) ----------
// "[N]월 계획 및 현황_수주"/"_매출" 시트: 사용자가 매주 로컬 엑셀 내용을 그대로 복붙해 갱신.
// 합계행("영업부서" 열에 "합계")을 찾아 데이터 시작 위치를 얻는다 — 컬럼 구조는 두 시트가 서로 다름.
function findExecOrdersDataStart(grid) {
  for (let i = 0; i < grid.length; i++) {
    if (stripSpaces(grid[i][4]) === "합계") return i + 1;
  }
  throw new Error("실행계획(수주) 시트 구조를 인식할 수 없습니다 (합계 행을 찾지 못함)");
}
function findExecRevenueDataStart(grid) {
  for (let i = 0; i < grid.length; i++) {
    if (stripSpaces(grid[i][5]) === "합계") return i + 1;
  }
  throw new Error("실행계획(매출) 시트 구조를 인식할 수 없습니다 (합계 행을 찾지 못함)");
}

// A계획여부 B프로젝트코드 C프로젝트명 D프로젝트유형 E영업부서 F영업대표 G매출처명 H계약일자 I계약시작일 J계약종료일
// K[N]월수주계획 L[N]월수주실적 M GAP N계약여부 O~R 진행상황(1~4주차)
function buildExecOrdersList(grid, dataStart) {
  const rows = [];
  for (let i = dataStart; i < grid.length; i++) {
    const r = grid[i];
    const biz = stripSpaces(r[4]) ? String(r[4]).trim() : "";
    if (!biz) continue;
    rows.push({
      code: (r[1] || "").toString().trim(),
      planType: (r[0] || "").toString().trim(),
      name: (r[2] || "").toString().trim(), type: (r[3] || "").toString().trim(), biz,
      rep: (r[5] || "").toString().trim(), cust: (r[6] || "").toString().trim(),
      plan: toNum(r[10]), actual: toNum(r[11]), gap: toNum(r[12]),
      contractStatus: (r[13] || "").toString().trim(),
      weekNotes: [14, 15, 16, 17].map(idx => (r[idx] || "").toString().trim()),
    });
  }
  return rows;
}
// A계획여부 B상태 C프로젝트코드 D프로젝트명 E프로젝트유형 F영업부서 G영업대표 H매출처명 I계약일자 J계약시작일 K계약종료일
// L계약금액 M[N]월매출계획 N매출실적 O잔여매출(ERP) P GAP Q발행여부 R이월여부 S~V 진행상황(1~4주차)
function buildExecRevenueList(grid, dataStart) {
  const rows = [];
  for (let i = dataStart; i < grid.length; i++) {
    const r = grid[i];
    const biz = stripSpaces(r[5]) ? String(r[5]).trim() : "";
    if (!biz) continue;
    rows.push({
      code: (r[2] || "").toString().trim(),
      planType: (r[0] || "").toString().trim(),
      name: (r[3] || "").toString().trim(), type: (r[4] || "").toString().trim(), biz,
      rep: (r[6] || "").toString().trim(), cust: (r[7] || "").toString().trim(),
      plan: toNum(r[12]),
      actual: r[13] != null ? toNum(r[13]) : null,
      erpRemain: r[14] != null ? toNum(r[14]) : null,
      gap: toNum(r[15]), issueStatus: (r[16] || "").toString().trim(),
      weekNotes: [18, 19, 20, 21].map(idx => (r[idx] || "").toString().trim()),
    });
  }
  return rows;
}

let EXEC_ORDERS = [];
let EXEC_REVENUE = [];

function computeExecSummary(bizFilter) {
  const orders = EXEC_ORDERS.filter(r => bizMatch(r.biz, bizFilter));
  const oPlan = orders.reduce((s, r) => s + r.plan, 0);
  const oActual = orders.reduce((s, r) => s + r.actual, 0);
  const oCountPlan = orders.filter(r => r.plan > 0).length;
  const oCountActual = orders.filter(r => r.actual > 0).length;

  const revenue = EXEC_REVENUE.filter(r => bizMatch(r.biz, bizFilter));
  const rPlan = revenue.reduce((s, r) => s + r.plan, 0);
  const rActual = revenue.reduce((s, r) => s + (r.actual || 0), 0);
  const rErp = revenue.reduce((s, r) => s + (r.erpRemain || 0), 0);
  const rExpected = rActual + rErp;

  return {
    orders: {
      plan: oPlan, actual: oActual, gap: oActual - oPlan,
      rate: oPlan ? oActual / oPlan * 100 : null,
      countPlan: oCountPlan, countActual: oCountActual, countGap: oCountActual - oCountPlan,
      rows: orders,
    },
    revenue: {
      plan: rPlan, actual: rActual, erp: rErp, expected: rExpected, gap: rActual - rPlan,
      progress: rPlan ? rActual / rPlan * 100 : null,
      rate: rPlan ? rExpected / rPlan * 100 : null,
      rows: revenue,
    },
  };
}

function buildUnitData(gsGrid, wonGrid, wonDataStart, pipeGrid, pipeDataStart) {
  const blockStarts = findGSBlockStarts(gsGrid);
  const M = CLOSING_MONTH;
  return BIZ_UNITS.map((meta, i) => ({ meta, base: blockStarts[i] }))
    .filter(({ base }) => base !== undefined)
    .map(({ meta, base }) => {
    const raw = {};
    Object.keys(OFFSETS).forEach(k => { raw[k] = extractGSRow(gsGrid, base, k); });

    // 2026-08-14: 새 구글시트에서 GS의 피벗 체인(수주/매출_매입)이 정상 작동하는 것을 확인 —
    // 원장 재구성 없이 GS 시트 값을 그대로 신뢰(수주/매출/재료비/영업이익 전부).
    const 매출 = periodize(raw.매출.target, raw.매출.months);
    const 수주 = periodize(raw.수주.target, raw.수주.months);

    function pctOf(numArr, denArr, fromIdx, toIdx) {
      const n = sumRange(numArr, fromIdx, toIdx), d = sumRange(denArr, fromIdx, toIdx);
      return d ? +(n / d * 100).toFixed(2) : 0;
    }
    const 재료비율 = {
      cum: pctOf(raw.재료비.months, raw.매출.months, 0, M - 1),
      remain: pctOf(raw.재료비.months, raw.매출.months, M, 11),
      annual: pctOf(raw.재료비.months, raw.매출.months, 0, 11),
      target: raw.매출.target ? +(raw.재료비.target / raw.매출.target * 100).toFixed(2) : 0,
    };
    const OPEXmonths = raw.기술직접원가.months.map((v, idx) =>
      v + raw.직접경비.months[idx] + raw.영업OPEX.months[idx] + raw.기술OPEX간접비용.months[idx]);
    const OPEXtarget = raw.기술직접원가.target + raw.직접경비.target + raw.영업OPEX.target + raw.기술OPEX간접비용.target;
    const OPEX = periodize(OPEXtarget, OPEXmonths);

    const 영업이익 = periodize(raw.영업이익.target, raw.영업이익.months);

    const backlogRevenue = sumBacklogRevenue(wonGrid, wonDataStart, meta.biz);
    const funnelTarget = sumFunnelTarget(pipeGrid, pipeDataStart, meta.biz);
    const opProfitRatio = 매출.annual ? (영업이익.annual / 매출.annual * 100) : 0;

    // 월별 전망(1~12월 개별 카드)용 — 원시 12개월 배열을 억 단위로 변환해서 그대로 노출.
    const monthly = {
      수주: raw.수주.months.map(v => v / 1e8),
      매출: raw.매출.months.map(v => v / 1e8),
      영업이익: raw.영업이익.months.map(v => v / 1e8),
      OPEX: OPEXmonths.map(v => v / 1e8),
      재료비율: raw.매출.months.map((v, idx) => v ? +(raw.재료비.months[idx] / v * 100).toFixed(2) : 0),
    };

    return {
      key: meta.key, label: meta.label, tag: meta.tag, biz: meta.biz,
      kpi: { 수주, 매출, 영업이익 },
      extra: { 재료비율, OPEX },
      monthly,
      status: [
        { label: `수주잔고 매출 (${M}월 마감 기준)`, val: fmt(backlogRevenue / 1e8, 1), unit: "억원", drill: "수주잔고" },
        { label: "펀넬 매출 (연간목표)", val: fmt(funnelTarget / 1e8, 1), unit: "억원", drill: "펀넬매출" },
        { label: "연간 영업이익률 (예상)", val: fmt(opProfitRatio, 1), unit: "%" },
      ],
    };
  });
}

let PROJECTS_WON = [];
let PROJECTS_PIPELINE = [];
let UNITS = [];

async function loadLiveData() {
  const [gsGrid, wonGrid, pipeGrid, execOrdersGrid, execRevenueGrid] = await Promise.all([
    fetchGrid("GS"),
    fetchGrid("진행(계약)_리스트"), // range 지정 시 구글시트 헤더 자동인식 방식이 바뀌어 행 오프셋이 달라짐 — 전체 fetch 유지
    fetchGrid("사전(펀넬)_리스트", "A1:AY40"),
    fetchGrid(`${EXEC_MONTH}월 계획 및 현황_수주`),
    fetchGrid(`${EXEC_MONTH}월 계획 및 현황_매출`),
  ]);
  const wonDataStart = findWonDataStart(wonGrid);
  const pipeDataStart = findPipeDataStart(pipeGrid);
  PROJECTS_WON = buildWonList(wonGrid, wonDataStart);
  PROJECTS_PIPELINE = buildPipelineList(pipeGrid, pipeDataStart);
  UNITS = buildUnitData(gsGrid, wonGrid, wonDataStart, pipeGrid, pipeDataStart);
  EXEC_ORDERS = buildExecOrdersList(execOrdersGrid, findExecOrdersDataStart(execOrdersGrid));
  EXEC_REVENUE = buildExecRevenueList(execRevenueGrid, findExecRevenueDataStart(execRevenueGrid));
}

// ---------- 프로젝트 드릴다운 팝업 ----------
const BIZ_MAP = { all: null, infra: "인프라사업팀", fa: "FA사업팀", strategy: "전략/대외사업팀", strategybu: ["FA사업팀", "전략/대외사업팀"] };
const MONTH_LABEL = { cum: `1~${CLOSING_MONTH}월 누계`, remain: `${CLOSING_MONTH + 1}~12월 잔여` };

function monthTargets(monthKey) {
  if (monthKey === "cum") {
    const nums = [], yms = [];
    for (let m = 1; m <= CLOSING_MONTH; m++) { nums.push(m); yms.push(`2026${String(m).padStart(2, "0")}`); }
    return { nums, yms };
  }
  if (monthKey === "remain") {
    const nums = [], yms = [];
    for (let m = CLOSING_MONTH + 1; m <= 12; m++) { nums.push(m); yms.push(`2026${String(m).padStart(2, "0")}`); }
    return { nums, yms };
  }
  const n = parseInt(monthKey, 10); // 개별 월(1~12) 카드 클릭
  return { nums: [n], yms: [`2026${String(n).padStart(2, "0")}`] };
}

let modalCtx = null; // { unitKey, metric, monthKey }

// 수주잔고/펀넬매출 팝업의 월별 필터 버튼용 개월 범위.
function snapshotMonthRange(metric) {
  if (metric === "수주잔고") {
    const nums = []; for (let n = CLOSING_MONTH + 1; n <= 12; n++) nums.push(n);
    return nums;
  }
  return Array.from({ length: 12 }, (_, i) => i + 1); // 펀넬매출: 1~12월
}

function computeRows(unitKey, metric, monthKey, subMonth) {
  const bizFilter = BIZ_MAP[unitKey];

  if (metric === "수주잔고") {
    const nums = subMonth ? [subMonth] : snapshotMonthRange(metric);
    const rows = [];
    PROJECTS_WON.forEach(p => {
      const [biz, name, cust, rep, month, amt, ...rest] = p;
      const matRatio = rest.pop(); // 마지막 원소 = 당해재료비율(0~1), 나머지가 12개월 매출인식
      const m = rest;
      if (!bizMatch(biz, bizFilter)) return;
      const sum = nums.reduce((s, n) => s + m[n - 1], 0);
      if (sum !== 0) rows.push({ name, cust, rep, amt: sum, tag: "확정계약", cls: "won", matRatio });
    });
    rows.sort((a, b) => b.amt - a.amt);
    return { rows, total: rows.reduce((s, r) => s + r.amt, 0) };
  }

  if (metric === "펀넬매출") {
    // "전체"는 AI열 당해합계 기준(월별 매출인식 스케줄이 일부 프로젝트에서 비어있어 12개월 합과 안 맞을 수 있음, 2026-08-18 확인).
    // 특정 월을 고르면 그 달의 매출인식 예정 금액(월별 스케줄 값)을 그대로 사용.
    const rows = [];
    PROJECTS_PIPELINE.forEach(p => {
      const [biz, name, cust, rep, month, applied, prob, status, ...rest] = p;
      if (!bizMatch(biz, bizFilter)) return;
      const monthsArr = rest.slice(0, 12);
      const revThisYear = rest[12];
      const matRatio = rest[14];
      if ((parseInt(prob, 10) || 0) < 50) return; // S열 예상수주확률 50% 미만 제외(C열 "적용" 기준과 동일 — 2026-08-21 확인)
      const amt = subMonth ? monthsArr[subMonth - 1] : revThisYear;
      if (!amt) return;
      rows.push({ name, cust, rep, amt, month, tag: `${status} · 수주확률 ${prob}`, cls: "pipeline", matRatio });
    });
    rows.sort((a, b) => b.amt - a.amt);
    return { rows, total: rows.reduce((s, r) => s + r.amt, 0) };
  }

  const mt = monthTargets(monthKey);
  const nums = subMonth ? [subMonth] : mt.nums;
  const yms = subMonth ? [`2026${String(subMonth).padStart(2,"0")}`] : mt.yms;
  const rows = [];

  PROJECTS_WON.forEach(p => {
    const [biz, name, cust, rep, month, amt, ...rest] = p;
    const matRatio = rest.pop(); // 마지막 원소 = 당해재료비율(0~1), 나머지가 12개월 매출인식
    const m = rest;
    if (!bizMatch(biz, bizFilter)) return;
    const rev = m.reduce((s, v) => s + v, 0); // 당해 매출금액 = 해당 프로젝트의 1~12월 매출인식 합계
    if (metric === "수주") {
      if (yms.includes(month)) rows.push({ name, cust, rep, amt, rev, month, tag: "확정계약", cls: "won", matRatio });
    } else {
      const sum = nums.reduce((s, n) => s + m[n - 1], 0);
      if (sum !== 0) rows.push({ name, cust, rep, amt: sum, rev, tag: "확정계약", cls: "won", matRatio });
    }
  });

  PROJECTS_PIPELINE.forEach(p => {
    const [biz, name, cust, rep, month, applied, prob, status, ...rest] = p;
    const m = rest.slice(0, 12);
    const rev = rest[12]; // 당해 매출금액 = AI열 매출 당해합계
    const matRatio = rest[14];
    if (!bizMatch(biz, bizFilter)) return;
    if ((parseInt(prob, 10) || 0) < 50) return; // 수주확도(확률) 50% 미만 제외
    if (metric === "수주") {
      if (yms.includes(month)) rows.push({ name, cust, rep, amt: applied, rev, month, tag: `${status} · 수주확률 ${prob}`, cls: "pipeline", matRatio });
    } else {
      const sum = nums.reduce((s, n) => s + m[n - 1], 0);
      if (sum !== 0) rows.push({ name, cust, rep, amt: sum, rev, tag: `${status} · 수주확률 ${prob}`, cls: "pipeline", matRatio });
    }
  });

  rows.sort((a, b) => b.amt - a.amt);
  const total = rows.reduce((s, r) => s + r.amt, 0);
  return { rows, total };
}

// ---------- 펀넬 시뮬레이션 ----------
// 경영실적 화면의 연간 추정 수주/매출/영업이익(GS 시트 기준)은 이미 예상수주확률 50% 이상인 펀넬을 포함한 값.
// 여기서 기준을 50%보다 높이면(70/90/100%) "50%~기준 미만" 구간 프로젝트가 빠지는 효과를 시뮬레이션한다 —
// 즉 50% 선택 시에는 경영실적 화면과 완전히 동일한 값이 나와야 하고, 기준이 높아질수록 그만큼 줄어드는 방향.
// 실제 KPI 카드/계획대비실적비교표에는 영향 없음(시뮬레이션 전용, GS 원본 값은 그대로 둠).
const SIM_THRESHOLDS = [50, 70, 90, 100];
let simThreshold = 50;

// 50%~기준 미만 구간(경영실적엔 포함돼 있지만 기준을 높이면 빠지는 프로젝트)의 제외분(원 단위) —
// 수주는 수주확도 적용금액, 매출은 당해합계, 영업이익은 매출 감소분에서 그 프로젝트 재료비율만큼 뺀 매출총이익 감소 추정치.
function computeFunnelSimulation(thresholdPct) {
  return BIZ_UNITS.map(meta => {
    let removeOrder = 0, removeRevenue = 0, removeProfit = 0, count = 0;
    PROJECTS_PIPELINE.forEach(p => {
      const [biz, name, cust, rep, month, applied, prob, status, ...rest] = p;
      if (!bizMatch(biz, meta.biz)) return;
      const revThisYear = rest[12];
      const matRatio = rest[14];
      const probNum = parseInt(prob, 10) || 0;
      if (probNum < 50 || probNum >= thresholdPct) return; // 경영실적에 이미 없거나(50%미만) 새 기준도 만족(그대로 유지)하면 제외 대상 아님
      if (!revThisYear) return;
      removeOrder += applied;
      removeRevenue += revThisYear;
      removeProfit += revThisYear * (1 - (matRatio || 0));
      count++;
    });
    return { key: meta.key, removeOrder, removeRevenue, removeProfit, count };
  });
}

function selectSimThreshold(pct) {
  simThreshold = pct;
  renderSimPanel();
}

function renderSimPanel() {
  const sim = computeFunnelSimulation(simThreshold);
  const simMap = Object.fromEntries(sim.map(r => [r.key, r]));

  const btnsHtml = SIM_THRESHOLDS.map(p =>
    `<button type="button" class="month-filter-btn ${p === simThreshold ? 'active' : ''}" onclick="selectSimThreshold(${p})">${p}%</button>`
  ).join("");

  // 사업부별로 먼저 다 계산해두고, 표는 지표(행) × 사업부(열)로 뒤집어서 그림.
  const cols = BIZ_UNITS.map(meta => {
    const u = UNITS.find(x => x.key === meta.key);
    const rm = simMap[meta.key];
    if (!u || !rm) return null;
    const baseRevenue = u.kpi.매출.annual; // 억
    const baseMatCost = baseRevenue * (u.extra.재료비율.annual / 100); // 억
    const removeRevenue = rm.removeRevenue / 1e8;
    const removeMatCost = (rm.removeRevenue - rm.removeProfit) / 1e8; // 제외분의 재료비 = 매출 감소분 - 매출총이익 감소분
    const simRevenue = baseRevenue - removeRevenue;
    const simMatCost = baseMatCost - removeMatCost;
    const simMatRatio = simRevenue > 0 ? (simMatCost / simRevenue * 100) : 0;
    const matRatioDeltaP = simMatRatio - u.extra.재료비율.annual;
    const simProfit = u.kpi.영업이익.annual - rm.removeProfit / 1e8;
    const baseProfitRatio = baseRevenue ? (u.kpi.영업이익.annual / baseRevenue * 100) : 0;
    const simProfitRatio = simRevenue ? (simProfit / simRevenue * 100) : 0;
    return {
      label: meta.label,
      order: { val: u.kpi.수주.annual - rm.removeOrder / 1e8, removeEok: rm.removeOrder / 1e8 },
      revenue: { val: simRevenue, removeEok: removeRevenue },
      profit: { val: simProfit, removeEok: rm.removeProfit / 1e8 },
      matRatio: { val: simMatRatio, deltaP: matRatioDeltaP, invert: true },
      profitRatio: { val: simProfitRatio, deltaP: simProfitRatio - baseProfitRatio, invert: false },
    };
  }).filter(Boolean);

  function amtCell(entry) {
    // 델타 줄은 값이 없어도 항상 자리를 차지하게(visibility:hidden) 해서 50% 기준 선택 시에도 표 높이가 안 흔들리게 함.
    const show = entry.removeEok > 0.05;
    const minus = `<div style="font-size:11px;font-weight:700;color:var(--bad);margin-top:2px;${show ? '' : 'visibility:hidden;'}">-${fmt(entry.removeEok, 1)}억</div>`;
    return `<td class="num strong${entry.val < 0 ? ' neg' : ''}">${fmt(entry.val, 1)}억${minus}</td>`;
  }
  function pctCell(entry) {
    const d = entry.deltaP;
    const goodDirection = entry.invert ? d < 0 : d > 0; // 재료비율은 낮을수록, 영업이익율은 높을수록 좋음
    const show = Math.abs(d) > 0.05;
    const deltaHtml = `<div style="font-size:11px;font-weight:700;color:${goodDirection ? 'var(--good)' : 'var(--bad)'};margin-top:2px;${show ? '' : 'visibility:hidden;'}">${d > 0 ? '+' : ''}${fmt(d, 1)}%p</div>`;
    return `<td class="num strong${entry.val < 0 ? ' neg' : ''}">${fmt(entry.val, 1)}%${deltaHtml}</td>`;
  }

  const headHtml = `<th>지표</th>${cols.map(c => `<th class="num">${c.label}</th>`).join("")}`;
  const rowsHtml = `
    <tr><td class="metric">수주</td>${cols.map(c => amtCell(c.order)).join("")}</tr>
    <tr><td class="metric">매출</td>${cols.map(c => amtCell(c.revenue)).join("")}</tr>
    <tr><td class="metric">영업이익</td>${cols.map(c => amtCell(c.profit)).join("")}</tr>
    <tr><td class="metric">재료비율</td>${cols.map(c => pctCell(c.matRatio)).join("")}</tr>
    <tr><td class="metric">영업이익율</td>${cols.map(c => pctCell(c.profitRatio)).join("")}</tr>
  `;

  panelEl.innerHTML = `
    <div class="panel-title"><h2>펀넬 시뮬레이션</h2></div>
    <div class="table-card" style="padding:18px 20px 20px;">
      <div class="month-filter" style="padding:0 0 16px;border-bottom:none;">${btnsHtml}</div>
      <div class="table-scroll">
        <table class="cmp">
          <thead><tr>${headHtml}</tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>
    </div>
  `;
}

// ---------- 진행상황 입력(구글시트 쓰기) ----------
// Apps Script 웹앱 URL — 이 시트에 Extensions > Apps Script로 배포한 doPost 엔드포인트.
const PROGRESS_WEBHOOK_URL = "https://script.google.com/macros/s/AKfycbwdNuwHLqaLf_9ENIiPWSH02m1-BA6qH18iwbBpKuDTYIQihwqpvTAegCZZ89TevBRyUg/exec";
const WEEK_LABELS = ["1주차", "2주차", "3주차", "4주차"];
let progressCtx = null; // { code, sheet, kind, startCol, codeCol }

// 수주 시트: B열(2)=프로젝트코드, O열(15)부터 진행상황 4주차. 매출 시트: C열(3)=프로젝트코드, S열(19)부터.
const PROGRESS_SHEET_CFG = {
  orders: { list: () => EXEC_ORDERS, sheet: () => `${EXEC_MONTH}월 계획 및 현황_수주`, startCol: 15, codeCol: 2 },

};

function openProgressModal(code, kind) {
  kind = kind || "orders";
  const cfg = PROGRESS_SHEET_CFG[kind];
  const row = cfg.list().find(r => r.code === code);
  if (!row) return;
  progressCtx = { code, kind, sheet: cfg.sheet(), startCol: cfg.startCol, codeCol: cfg.codeCol };

  const body = document.getElementById("progressModalBody");

    <div class="progress-week">

    </div>`).join("") + `
    <div class="progress-actions">
      <span class="progress-status" id="progressStatus"></span>
      <button type="button" class="btn-cancel" onclick="closeProgressModal()">취소</button>
      <button type="button" class="btn-save" id="progressSaveBtn" onclick="saveProgress()">저장</button>
    </div>`;

  document.getElementById("progressModalOverlay").classList.add("open");
}

function closeProgressModal() {
  document.getElementById("progressModalOverlay").classList.remove("open");
  progressCtx = null;
}
document.getElementById("progressModalClose").addEventListener("click", closeProgressModal);
document.getElementById("progressModalOverlay").addEventListener("click", (e) => {
  if (e.target.id === "progressModalOverlay") closeProgressModal();
});

async function saveProgress() {
  if (!progressCtx) return;
  const weeks = [0, 1, 2, 3].map(i => document.getElementById(`progWeek${i}`).value);
  const statusEl = document.getElementById("progressStatus");
  const btn = document.getElementById("progressSaveBtn");
  btn.disabled = true;
  statusEl.textContent = "저장 중…";
  statusEl.className = "progress-status";
  try {
    const res = await fetch(PROGRESS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // Apps Script 프리플라이트 회피용
      body: JSON.stringify({
        code: progressCtx.code, sheet: progressCtx.sheet, weeks,
        startCol: progressCtx.startCol, codeCol: progressCtx.codeCol,
      }),
    });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "저장 실패");

    const row = PROGRESS_SHEET_CFG[progressCtx.kind].list().find(r => r.code === progressCtx.code);
    if (row) row.weekNotes = weeks;

    statusEl.textContent = "저장됐습니다";
    statusEl.className = "progress-status ok";
    const u = UNITS.find(x => x.key === (tabsEl.querySelector("button.active")?.dataset.key || "all"));
    if (u && currentPage === "exec") renderExecPanel(u);
  } catch (err) {
    statusEl.textContent = `저장 실패: ${err.message || err}`;
    statusEl.className = "progress-status err";
  } finally {
    btn.disabled = false;
  }
}

// 배지 등급
// 수주·매출: 시간 경과 대비 진행 속도 기준. 벤치마크 = 마감월/12 (예: 7월 마감 → 58.3%).
//   누계 진행률(=누계÷연간목표)이 벤치마크보다 +5%p 넘게 앞서면 양호, ±5%p 이내면 보통, 그 아래면 주의.
// 영업이익: 누계 적자면 무조건 주의. 흑자면 누계 진행률(=누계÷연간목표) 기준 — 90%↑양호, 50~89%보통, 50%↓주의.
function badgeFor(name, d) {
  if (!d.target) return null;
  if (name === "수주" || name === "매출") {
    const benchmark = (CLOSING_MONTH / 12) * 100;
    const progress = (d.cum / d.target) * 100;
    const diff = progress - benchmark;
    if (diff > 5) return "good";
    if (diff >= -5) return "warn";
    return "bad";
  }
  if (d.cum < 0) return "bad";
  const progress = (d.cum / d.target) * 100;
  if (progress >= 90) return "good";
  if (progress >= 50) return "warn";
  return "bad";
}

// ---------- helpers ----------
function fmt(n, digits) {
  if (n === null || n === undefined) return "–";
  let d = digits === undefined ? (Math.abs(n) < 10 ? 1 : 0) : digits;
  // 억원 단위(1자리) 표시일 때, 500만원(0.05억) 미만 금액은 반올림하면 0.0으로 사라지므로 2자리까지 표시
  if (d === 1 && n !== 0 && Math.abs(n) < 0.05) d = 2;
  return n.toFixed(d);
}
function deltaClass(n, invert) {
  const positive = invert ? n < 0 : n > 0;
  const negative = invert ? n > 0 : n < 0;
  return positive ? "up" : negative ? "down" : "flat";
}
function arrow(n) { return n > 0 ? "▲" : n < 0 ? "▼" : "–"; }

function gauge(pct, size, colorVar) {
  const clamped = Math.max(-100, Math.min(150, pct));
  const r = size / 2 - 6;
  const c = 2 * Math.PI * r;
  const displayPct = Math.max(0, Math.min(100, clamped));
  const dash = (displayPct / 100) * c;
  const neg = pct < 0;
  const color = neg ? "var(--bad)" : colorVar;
  return `
  <div class="gauge">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}">
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="var(--surface-3)" stroke-width="7"/>
      <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="7"
        stroke-linecap="round" stroke-dasharray="${dash} ${c-dash}"
        transform="rotate(-90 ${size/2} ${size/2})"/>
      <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" class="gauge-pct" style="font-size:${Math.round(size*0.2)}px" fill="${neg ? 'var(--bad)' : 'var(--ink-900)'}">${fmt(pct,0)}%</text>
    </svg>
  </div>`;
}

function badgeHtml(status, text) {
  if (!status) return "";
  return `<span class="kpi-badge ${status}"><span class="dot"></span>${text}</span>`;
}

function kpiCard(name, d, unit, badgeStatus) {
  const progress = d.target ? (d.cum / d.target) * 100 : null;
  const achieve = d.target ? (d.annual / d.target) * 100 : null;
  const badgeText = badgeStatus === "good" ? "양호" : badgeStatus === "warn" ? "보통" : badgeStatus === "bad" ? "주의" : "";
  const gaugeVal = progress !== null ? progress : (d.annual >= 0 ? 100 : -100);
  return `
  <div class="kpi-card">
    <div class="kpi-head">
      <div class="kpi-label">${name}</div>
      ${badgeHtml(badgeStatus, badgeText)}
    </div>
    <div class="kpi-body">
      ${gauge(gaugeVal, 64, "var(--accent-2)")}
      <div>
        <div><span class="kpi-num ${d.cum < 0 ? 'neg':''}">${fmt(d.cum,1)}</span><span class="kpi-unit">억원 · 누계</span></div>
      </div>
    </div>
    <div class="kpi-foot">
      <div class="item"><span class="l">연간목표</span><span class="v flat">${d.target?fmt(d.target,1)+'억':'–'}</span></div>
      <div class="item"><span class="l">연간예상</span><span class="v ${d.annual<0?'down':'flat'}">${fmt(d.annual,1)}억</span></div>
      <div class="item"><span class="l">목표 달성률</span><span class="v ${achieve===null?'flat':(achieve>=100?'up':'down')}">${achieve===null?'–':fmt(achieve,0)+'%'}</span></div>
      <div class="item"><span class="l">${CLOSING_MONTH+1}월 예상 실적</span><span class="v ${d.aug<0?'down':'flat'}">${fmt(d.aug,1)}억</span></div>
    </div>
  </div>`;
}

function cmpRow(label, unitTxt, targetVal, cumVal, remainVal, annualVal, vsTargetDelta, vsTargetPct, ppMode, invert, drill) {
  const suffix = ppMode ? "%p" : (unitTxt === "%" ? "%p" : "억");
  const pctSuffix = ppMode ? "%p" : "%";
  function numStr(v) { return suffix === "억" ? fmt(v, 1) : v.toFixed(1); }
  function cell(v) { return typeof v === 'number' ? numStr(v) + unitTxt : '–'; }
  function deltaCell(delta, pct) {
    if (delta === undefined || delta === null) return `<td class="num">–</td>`;
    const cls = deltaClass(delta, invert);
    const sign = ppMode ? (delta > 0 ? "+" : delta < 0 ? "-" : "–") : arrow(delta);
    return `<td class="num"><span class="delta ${cls}"><span class="arrow">${sign}</span> ${numStr(Math.abs(delta))}${suffix}${pct!==undefined?` (${fmt(pct,0)}${pctSuffix})`:''}</span></td>`;
  }
  function drillCell(v, monthKey) {
    const cls = `num strong ${typeof v === 'number' && v < 0 ? 'neg' : ''}${drill ? ' cmp-cum-drill' : ''}`;
    const click = drill ? ` onclick="openProjectModal('${drill.unitKey}','${drill.metric}','${monthKey}')"` : "";
    return `<td class="${cls}"${click}>${cell(v)}</td>`;
  }
  return `<tr>
    <td class="metric">${label}</td>
    <td class="num strong ${typeof targetVal === 'number' && targetVal < 0 ? 'neg' : ''}">${cell(targetVal)}</td>
    ${drillCell(cumVal, "cum")}
    ${drillCell(remainVal, "remain")}
    <td class="num strong ${typeof annualVal === 'number' && annualVal < 0 ? 'neg' : ''}">${cell(annualVal)}</td>
    ${deltaCell(vsTargetDelta, vsTargetPct)}
  </tr>`;
}

// 펀넬 시뮬레이션은 사업부 전용 링크(?unit=...)에는 안 보이고 메인 URL(전사용)에서만 노출.

function buildTabs() {
  tabsEl.innerHTML = "";
  const visibleUnits = VIEW ? UNITS.filter(u => VIEW.keys.includes(u.key)) : UNITS;
  visibleUnits.forEach((u, i) => {
    const btn = document.createElement("button");
    btn.dataset.key = u.key;
    btn.className = i === 0 ? "active" : "";
    btn.innerHTML = `${u.label}${u.tag ? `<span class="unit-tag">${u.tag}</span>` : ""}`;
    btn.addEventListener("click", () => selectTab(u.key));
    tabsEl.appendChild(btn);

let currentPage = "main"; // "main" | "exec"

function selectTab(key) {
  [...tabsEl.children].forEach(b => b.classList.toggle("active", b.dataset.key === key));
  const u = UNITS.find(x => x.key === key);
  if (currentPage === "exec") renderExecPanel(u);
  else if (currentPage === "weekly") renderWeeklyPanel(u);
  else renderPanel(u);
  window.scrollTo({ top: 0, behavior: "auto" });
}

function switchPage(page) {
  currentPage = page;
  document.querySelectorAll("#pageSwitch button").forEach(b => b.classList.toggle("active", b.dataset.page === page));

  // 시뮬레이션 화면은 사업부 탭 없이 전사/인프라/FA/전략·대외/전략사업부를 한 화면에 같이 보여줌.
  if (page === "sim") {
    tabsEl.style.display = "none";
    renderSimPanel();
    window.scrollTo({ top: 0, behavior: "auto" });
    return;
  }
  tabsEl.style.display = "";

  const activeKey = tabsEl.querySelector("button.active")?.dataset.key || (VIEW ? VIEW.default : "all");

document.querySelectorAll("#pageSwitch button").forEach(b => b.addEventListener("click", () => switchPage(b.dataset.page)));

function gapText(v) {
  return v === 0 ? "–" : `${v >= 0 ? '+' : ''}${fmt(v / 1e8, 1)}억`;
}
function amtText(v) {
  return (v == null || v === 0) ? "–" : `${fmt(v / 1e8, 1)}억`;
}
function gapClass(v) { return v > 0 ? "up" : v < 0 ? "down" : "flat"; }
function typeLabel(type) { return type === "유지보수" ? "유지보수" : (type ? "구축" : "–"); }
function gapStyleAttr(v) {
  if (v > 0) return ' style="color:var(--good)"';
  if (v < 0) return ' style="color:var(--bad)"';
  return "";
}

function contractBadge(status) {
  const signed = status === "계약완료";
  return `<span class="proj-badge ${signed ? 'won' : 'bad'}">${status || '–'}</span>`;
}

function execBadge(planType) {
  return planType === "실행계획 外"
    ? '<span class="proj-badge pipeline">실행계획外</span>'
    : '<span class="proj-badge won">실행계획</span>';
}

  const sum = computeExecSummary(u.biz);

          return `
          <tr class="proj-clickable" onclick="openProgressModal('${row.code}','orders')">
            <td>
              <div class="pname">${row.name}</div>
              <div class="pmeta">${row.cust} · ${row.rep}</div>

            <td class="status">${contractBadge(row.contractStatus)}</td>

        }).join("")}

      <tfoot>
        <tr>
          <td colspan="3">합계</td>
          <td class="num pamt">${amtText(o.plan)}</td>

          <td class="num pamt"${gapStyleAttr(o.gap)}>${gapText(o.gap)}</td>
          <td></td>

      </tfoot>

  // 실적 있는 프로젝트(실적 큰 순) 먼저, 실적 없는 프로젝트는 계획 큰 순
  const revRows = r.rows.slice().sort((a, b) => {
    const aHas = a.actual != null && a.actual !== 0;
    const bHas = b.actual != null && b.actual !== 0;
    if (aHas !== bHas) return aHas ? -1 : 1;
    return aHas ? (b.actual - a.actual) : (b.plan - a.plan);
  });
  const revTable = revRows.length === 0 ? `<div class="modal-empty">해당 프로젝트가 없습니다.</div>` : `

      <tbody>
        ${revRows.map(row => {
          const latestNote = row.weekNotes.slice().reverse().find(n => n);
          return `
          <tr class="proj-clickable" onclick="openProgressModal('${row.code}','revenue')">

      </tbody>
      <tfoot>
        <tr>
          <td colspan="2">합계</td>
          <td class="num pamt">${amtText(r.plan)}</td>
          <td class="num pamt">${amtText(r.actual)}</td>
          <td class="num pamt">${amtText(r.erp)}</td>
          <td class="num pamt"${gapStyleAttr(r.gap)}>${gapText(r.gap)}</td>
          <td></td>
        </tr>
      </tfoot>
    </table>`;

  panelEl.innerHTML = `
    <div class="panel-title"><h2>${EXEC_MONTH}월 실행계획 대비 실적</h2><span class="hint">주간 실행계획 리뷰 기준</span></div>
    <div class="kpi-row" style="grid-template-columns: repeat(2, 1fr);">${orderCard}${revCard}</div>

    <div class="panel-title"><h2>실행계획 대비 수주 현황</h2><span class="hint">${o.rows.filter(x => x.contractStatus === "계약완료").length}건</span></div>
    <div class="table-card"><div class="table-scroll">${orderTable}</div></div>

    <div class="panel-title"><h2>실행계획 대비 매출 현황</h2><span class="hint">${r.rows.length}건</span></div>
    <div class="table-card"><div class="table-scroll">${revTable}</div></div>
  `;
}

// ---------- 주간업무보고 (사업부별 시트에 신규 행 누적 입력) ----------
// 사업부 key -> 실제 구글시트 탭 이름. FA/전략 시트는 아직 없음 — 생기면 여기 한 줄만 추가하면 됨.
const WEEKLY_REPORT_SHEETS = {
  infra: "주간업무보고_인프라",
  fa: "주간업무보고_FA",
  strategy: "주간업무보고_전략",
};
