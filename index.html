const WEEKLY_UNIT_LABEL = { infra: "인프라사업부", fa: "FA사업팀", strategy: "전략·대외사업팀" }; // 전사/전략사업부처럼 여러 시트를 합쳐 보여줄 때 어느 팀 보고인지 표시용
const WEEKLY_CACHE = {}; // { [sheetName]: { valid: bool, rows: [...] } }

function parseGvizDate(v) {
  if (typeof v !== "string") return null;
  const m = v.match(/^Date\((\d+),(\d+),(\d+)\)$/);
  if (!m) return null;
  return new Date(+m[1], +m[2], +m[3]); // gviz month는 이미 0-indexed
}
function fmtMD(d) { return d ? `${d.getMonth() + 1}/${d.getDate()}` : "–"; }

// 주간업무보고는 "다음 주에 할 업무"를 전주 중(화~일)에 미리 작성하는 방식이라,
// 월요일 당일 작성분만 그 주 자체로 남기고, 화~일에 작성하면 다음 주 월~금 기준으로 저장한다.
// 주차 = 그 주 월요일 날짜를 7로 올림나눔(월 시작 기준 몇 번째 주).
function getWeekInfo(now) {
  const day = now.getDay(); // 0=일 ... 6=토
  const diffToMonday = (day + 6) % 7;
  const thisMonday = new Date(now); thisMonday.setDate(now.getDate() - diffToMonday); thisMonday.setHours(0, 0, 0, 0);
  const monday = new Date(thisMonday);
  if (day !== 1) monday.setDate(thisMonday.getDate() + 7); // 월요일이 아니면 다음 주로
  const friday = new Date(monday); friday.setDate(monday.getDate() + 4);
  return { year: monday.getFullYear(), month: monday.getMonth() + 1, week: Math.ceil(monday.getDate() / 7), monday, friday };
}
function isoDate(d) { return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; }

// 수행 기간: 입력은 시작월/종료월을 따로 받지만(<input type="month">), 시트엔 "26년 M월 ~ 27년 M월" 한 칸으로 합쳐서 저장.
// 대시보드 전체가 연도를 2자리로 표기하는 관례(예: "26년 8월 3주차")를 그대로 따름.
function ymToLabel(ym) {
  if (!ym) return "";
  const [y, m] = ym.split("-");
  return `${y.slice(2)}년 ${Number(m)}월`;
}
function formatTimingRange(startYM, endYM) {
  const s = ymToLabel(startYM), e = ymToLabel(endYM);
  if (s && e) return `${s} ~ ${e}`;
  return s || e || "";
}
// 수정 폼을 열 때 기존 "26년 M월 ~ 27년 M월"(또는 단일 "26년 M월") 텍스트를 <input type="month"> 값으로 역파싱. 2자리/4자리 연도 모두 인식.
// 이 패턴과 안 맞는 옛날 자유 텍스트("미정" 등)는 빈칸으로 남음(저장 시 값을 다시 채워야 함 — 프로젝트 유형 select와 동일한 방식).
function parseTimingRange(text) {
  if (!text) return { start: "", end: "" };
  const toYM = (y, m) => `${y.length === 2 ? "20" + y : y}-${m.padStart(2, "0")}`;
  const range = text.match(/^(\d{2,4})년\s*(\d{1,2})월\s*~\s*(\d{2,4})년\s*(\d{1,2})월$/);
  if (range) return { start: toYM(range[1], range[2]), end: toYM(range[3], range[4]) };
  const single = text.match(/^(\d{2,4})년\s*(\d{1,2})월$/);
  if (single) return { start: toYM(single[1], single[2]), end: "" };
  return { start: "", end: "" };
}

// 새 보고 작성/수정 폼 공통 필수값 검증. prefix는 "wf"(새 보고) 또는 "we"(수정).
// 프로젝트/고객사·담당자/프로젝트 유형/사업 규모/수행 기간/수주 확도 모두 필수.
function collectWeeklyFormFields(prefix) {
  const project = document.getElementById(`${prefix}_project`).value.trim();
  const contact = document.getElementById(`${prefix}_contact`).value.trim();
  const type = document.getElementById(`${prefix}_type`).value.trim();
  const scale = document.getElementById(`${prefix}_scale`).value.trim();
  const timingStart = document.getElementById(`${prefix}_timing_start`).value;
  const timingEnd = document.getElementById(`${prefix}_timing_end`).value;
  const probRaw = document.getElementById(`${prefix}_prob`).value;
  if (!project) return { error: "프로젝트명을 입력해주세요" };
  if (!contact) return { error: "고객사 / 담당자를 입력해주세요" };
  if (!type) return { error: "프로젝트 유형을 선택해주세요" };
  if (!scale) return { error: "사업 규모(금액)를 입력해주세요" };
  if (!timingStart || !timingEnd) return { error: "수행 기간(시작월~종료월)을 입력해주세요" };
  if (probRaw === "") return { error: "수주 확도를 입력해주세요" };
  return {
    values: {
      project, contact, type, scale,
      timing: formatTimingRange(timingStart, timingEnd),
      prob: Number(probRaw) || 0,
    },
  };
}

// 시트가 존재하는지(A1 라벨이 "연도"인지)까지 확인 — 없는 시트명을 gviz에 물으면 조용히 GS 시트를 반환하므로 반드시 검증 필요.
async function fetchWeeklySheetRows(sheetName) {
  if (WEEKLY_CACHE[sheetName]) return WEEKLY_CACHE[sheetName];
  try {
    const res = await fetch(gvizUrl(sheetName));
    const text = await res.text();
    const jsonStr = text.slice(text.indexOf("{"), text.lastIndexOf("}") + 1);
    const obj = JSON.parse(jsonStr);
    const valid = obj.table.cols && obj.table.cols[0] && stripSpaces(obj.table.cols[0].label) === "연도";
    const rows = valid ? obj.table.rows.map(r => (r.c || []).map(cell => (cell ? cell.v : null))) : [];
    const result = { valid, rows };
    WEEKLY_CACHE[sheetName] = result;
    return result;
  } catch (err) {
    const result = { valid: false, rows: [] };
    WEEKLY_CACHE[sheetName] = result;
    return result;
  }
}

function buildWeeklyReportRows(raw) {
  return raw.map(r => ({
    year: toNum(r[0]), month: toNum(r[1]), week: toNum(r[2]),
    start: parseGvizDate(r[3]), end: parseGvizDate(r[4]),
    project: (r[5] || "").toString().trim(), contact: (r[6] || "").toString().trim(),
    type: (r[7] || "").toString().trim(), scale: (r[8] || "").toString().trim(),
    timing: (r[9] || "").toString().trim(), prob: Math.round(toNum(r[10]) * 100), // K열은 0~1 사이 소수를 %서식으로 표시(0.5=50%) — 100으로 곱해서 실제 % 숫자로 변환
    status: (r[11] || "").toString().trim(), issue: (r[12] || "").toString().trim(),
    solution: (r[13] || "").toString().trim(),
    id: (r[14] || "").toString().trim(), // O열: 수정/삭제 대상 지정용 고유ID. 신규 등록 행부터 채워짐(기존 행은 비어있어 수정/삭제 버튼 미표시).
  }));
}

function weeklyReportCard(r, opts = {}) {
  const badge = opts.showBadge && r.unit ? `<span class="week-badge">${WEEKLY_UNIT_LABEL[r.unit] || r.unit}</span>` : "";
  const actions = opts.editable && r.id ? `
    <div class="week-card-actions">
      <button type="button" class="week-card-btn" onclick="startEditWeeklyReport('${r.id}')">수정</button>
      <button type="button" class="week-card-btn danger" onclick="deleteWeeklyReport('${r.id}')">삭제</button>
    </div>` : "";
  return `
  <div class="week-card">
    <div class="week-card-head">
      <div class="week-pname">${badge}${r.project || "(프로젝트명 없음)"}</div>
      <span class="week-range">${r.timing || "–"}</span>
    </div>
    <div class="week-meta">${r.contact}${r.type ? ` · ${r.type}` : ''}${r.scale ? ` · ${r.scale}` : ''}${r.prob ? ` · 수주확도 ${r.prob}%` : ''}</div>
    ${r.status ? `<div class="week-field"><b>진행 현황</b><p>${r.status.replace(/\n/g, '<br>')}</p></div>` : ''}
    ${r.issue ? `<div class="week-field"><b>이슈 및 리스크</b><p>${r.issue.replace(/\n/g, '<br>')}</p></div>` : ''}
    ${r.solution ? `<div class="week-field"><b>해결책 및 대안</b><p>${r.solution.replace(/\n/g, '<br>')}</p></div>` : ''}
    ${actions}
  </div>`;
}

// 프로젝트 유형은 구축/유지보수 둘 중 하나로만 입력되게 — 자유 텍스트 대신 select
const PROJECT_TYPE_OPTIONS = ["구축", "유지보수"];
function projectTypeOptionsHtml(current) {
  // "선택"은 처음 값으로만 보이고 목록엔 안 뜨게(hidden) — 실제 선택지는 구축/유지보수 두 개뿐.
  const placeholder = `<option value="" disabled hidden ${!current ? "selected" : ""}>선택</option>`;
  const opts = PROJECT_TYPE_OPTIONS.map(t => `<option value="${t}" ${current === t ? "selected" : ""}>${t}</option>`);
  return placeholder + opts.join("");
}

// 카드 목록 안에서 수정 버튼을 누른 항목만 이 폼으로 교체되어 바로 그 자리에서 편집.
function weeklyEditCard(r) {
  return `
  <div class="week-card week-form-card">
    <div class="week-form-grid">
      <div class="progress-week"><label>프로젝트<span class="req">*</span></label><input type="text" id="we_project" value="${escAttr(r.project)}"></div>
      <div class="progress-week"><label>고객사 / 담당자<span class="req">*</span></label><input type="text" id="we_contact" value="${escAttr(r.contact)}"></div>
      <div class="progress-week"><label>프로젝트 유형<span class="req">*</span></label><select id="we_type">${projectTypeOptionsHtml(r.type)}</select></div>
      <div class="progress-week"><label>사업 규모(금액)<span class="req">*</span></label><input type="text" id="we_scale" value="${escAttr(r.scale)}"></div>
      <div class="progress-week"><label>수행 기간<span class="req">*</span></label><div class="timing-range"><input type="month" id="we_timing_start" value="${escAttr(parseTimingRange(r.timing).start)}"><span>~</span><input type="month" id="we_timing_end" value="${escAttr(parseTimingRange(r.timing).end)}"></div></div>
      <div class="progress-week"><label>수주 확도(%)<span class="req">*</span></label><input type="number" id="we_prob" min="0" max="100" step="5" value="${escAttr(r.prob || 0)}"></div>
    </div>
    <div class="progress-week"><label>주요 일정 및 진행 현황</label><textarea id="we_status" rows="3">${escAttr(r.status)}</textarea></div>
    <div class="progress-week"><label>이슈 및 리스크</label><textarea id="we_issue" rows="2">${escAttr(r.issue)}</textarea></div>
    <div class="progress-week"><label>해결책 및 대안</label><textarea id="we_solution" rows="2">${escAttr(r.solution)}</textarea></div>
    <div class="progress-actions">
      <span class="progress-status" id="weeklyEditStatus"></span>
      <button type="button" class="btn-cancel" onclick="cancelEditWeeklyReport()">취소</button>
      <button type="button" class="btn-save" id="weeklyEditSaveBtn" onclick="saveEditedWeeklyReport('${r.id}')">저장</button>
    </div>
  </div>`;
}

// 주차별 필터 — 리스트가 길어지니 한 번에 다 보여주지 않고 주차를 선택해서 볼 수 있게 함.
let weeklyCurrentList = []; // 현재 패널에 로드된 전체 리스트(필터 전)
let weeklyCurrentWeekKey = null; // 현재 선택된 주차 필터
let weeklyListOpts = {}; // { showBadge, editable } — 전사/전략사업부 합산뷰는 읽기 전용, 개별 사업부 탭만 수정/삭제 가능
let weeklyEditingId = null; // 현재 인라인 수정 폼으로 펼쳐진 항목의 id
function weekKeyOf(r) { return `${r.year}-${r.month}-${r.week}`; }

// "N건 · 8/17 ~ 8/21" — 건수와 그 주차의 날짜 범위를 함께 표시. 날짜는 카드 낱개가 아니라 헤더에 한 번만.
function weeklyCountLabel(list, key) {
  const filtered = key ? list.filter(r => weekKeyOf(r) === key) : list;
  const range = filtered.length > 0 ? `${fmtMD(filtered[0].start)} ~ ${fmtMD(filtered[0].end)}` : "";
  return `${filtered.length}건${range ? ` · ${range}` : ""}`;
}

function renderWeeklyListSection(list, selectedKey, opts = {}) {
  weeklyCurrentWeekKey = selectedKey;
  const weekOptions = [];
  const seen = new Set();
  list.forEach(r => {
    const k = weekKeyOf(r);
    if (!seen.has(k)) { seen.add(k); weekOptions.push({ key: k, year: r.year, month: r.month, week: r.week }); }
  }); // list가 이미 최신순 정렬돼있어 weekOptions도 자연히 최신 주차부터 나열됨

  const filterHtml = weekOptions.length > 1 ? `
    <div class="week-filter-wrap">
      <button type="button" class="week-filter-arrow" onclick="scrollWeekFilter(-1)" aria-label="이전 주차">‹</button>
      <div class="week-filter-scroll" id="weekFilterScroll">
        ${weekOptions.map(w => `<button type="button" class="month-filter-btn ${w.key === selectedKey ? 'active' : ''}" onclick="filterWeeklyList('${w.key}')">${String(w.year).slice(2)}년 ${w.month}월 ${w.week}주차</button>`).join("")}
      </div>
      <button type="button" class="week-filter-arrow" onclick="scrollWeekFilter(1)" aria-label="다음 주차">›</button>
    </div>` : "";

  const filtered = selectedKey ? list.filter(r => weekKeyOf(r) === selectedKey) : list;
  const listHtml = filtered.length === 0
    ? `<div class="modal-empty">등록된 보고가 없습니다.</div>`
    : `<div class="week-list">${filtered.map(r => (opts.editable && r.id && r.id === weeklyEditingId) ? weeklyEditCard(r) : weeklyReportCard(r, opts)).join("")}</div>`;

  // 건수+날짜 표시는 전체가 아니라 지금 선택된 주차 기준으로 — 주차 필터를 바꿀 때마다 같이 갱신.
  const countEl = document.getElementById("weeklyCountHint");
  if (countEl) countEl.textContent = weeklyCountLabel(list, selectedKey);

  return filterHtml + listHtml;
}

function scrollWeekFilter(dir) {
  const el = document.getElementById("weekFilterScroll");
  if (el) el.scrollBy({ left: dir * 240, behavior: "smooth" });
}

function filterWeeklyList(weekKey) {
  document.getElementById("weeklyListContainer").innerHTML = renderWeeklyListSection(weeklyCurrentList, weekKey, weeklyListOpts);
}

function startEditWeeklyReport(id) {
  weeklyEditingId = id;
  filterWeeklyList(weeklyCurrentWeekKey);
}

function cancelEditWeeklyReport() {
  weeklyEditingId = null;
  filterWeeklyList(weeklyCurrentWeekKey);
}

let weeklyRenderToken = 0; // 비동기 렌더 경합 방지: 페이지/탭을 빠르게 전환하면 먼저 시작한 fetch가 나중에 끝나 화면을 덮어쓸 수 있어 토큰으로 최신 호출만 반영.
let weeklyCurrentUnit = null; // 수정/삭제 저장 후 재렌더링할 때 다시 넘겨줄 현재 탭

async function renderWeeklyPanel(u) {
  const myToken = ++weeklyRenderToken;
  weeklyCurrentUnit = u;
  weeklyEditingId = null;
  panelEl.innerHTML = `<div class="panel-title"><h2>주간업무보고</h2><span class="hint">불러오는 중…</span></div>`;

  const combinedKeys = WEEKLY_COMBINED[u.key];
  if (combinedKeys) {
    const results = await Promise.all(combinedKeys.map(k => WEEKLY_REPORT_SHEETS[k] ? fetchWeeklySheetRows(WEEKLY_REPORT_SHEETS[k]) : { valid: false, rows: [] }));
    if (myToken !== weeklyRenderToken) return;
    const allRows = results.flatMap((r, i) => r.valid ? buildWeeklyReportRows(r.rows).map(row => ({ ...row, unit: combinedKeys[i] })) : []);
    allRows.sort((a, b) => (b.start || 0) - (a.start || 0));
    weeklyCurrentList = allRows;
    weeklyListOpts = { showBadge: true, editable: false }; // 전사/전략사업부 합산뷰는 여러 시트가 섞여있어 읽기 전용
    const defaultKey = allRows.length > 0 ? weekKeyOf(allRows[0]) : null;
    panelEl.innerHTML = `
      <div class="panel-title"><h2>주간업무보고</h2><span class="hint" id="weeklyCountHint">${weeklyCountLabel(allRows, defaultKey)}</span></div>
      <div id="weeklyListContainer">${renderWeeklyListSection(allRows, defaultKey, weeklyListOpts)}</div>
    `;
    return;
  }

  const sheetName = WEEKLY_REPORT_SHEETS[u.key];
  if (!sheetName) {
    panelEl.innerHTML = `<div class="panel-title"><h2>주간업무보고</h2></div><div class="modal-empty">이 화면에서는 지원하지 않는 사업부입니다.</div>`;
    return;
  }
  const { valid, rows } = await fetchWeeklySheetRows(sheetName);
  if (myToken !== weeklyRenderToken) return;
  if (!valid) {
    panelEl.innerHTML = `
      <div class="panel-title"><h2>주간업무보고</h2></div>
      <div class="modal-empty">"${sheetName}" 시트가 아직 준비되지 않았습니다. 구글시트에 해당 탭을 먼저 만들어주세요.</div>`;
    return;
  }
  const list = buildWeeklyReportRows(rows).map(row => ({ ...row, unit: u.key })).sort((a, b) => (b.start || 0) - (a.start || 0));

  weeklyCurrentList = list;
  weeklyListOpts = { showBadge: false, editable: true };
  const defaultKey = list.length > 0 ? weekKeyOf(list[0]) : null;

  panelEl.innerHTML = `
    <div class="panel-title">
      <h2>주간업무보고</h2><span class="hint" id="weeklyCountHint">${weeklyCountLabel(list, defaultKey)}</span>
      <button type="button" class="btn-save panel-title-action" id="weeklyToggleBtn" onclick="toggleWeeklyForm('${u.key}')">+ 새 보고 작성</button>
    </div>
    <div id="weeklyFormInline"></div>
    <div id="weeklyListContainer">${renderWeeklyListSection(list, defaultKey, weeklyListOpts)}</div>
  `;
}

// 팝업이 아니라 목록 위에 바로 펼쳐지는 방식 — 아래 등록된 보고 내용을 보면서 복사/참고해 작성할 수 있도록.
function toggleWeeklyForm(unitKey) {
  const container = document.getElementById("weeklyFormInline");
  const btn = document.getElementById("weeklyToggleBtn");
  if (container.innerHTML.trim()) {
    container.innerHTML = "";
    btn.textContent = "+ 새 보고 작성";
    return;
  }
  const wk = getWeekInfo(new Date());
  container.innerHTML = `
    <div class="week-form-card">
      <div class="progress-week"><label style="font-size:12.5px;">${wk.year}년 ${wk.month}월 ${wk.week}주차 (${fmtMD(wk.monday)}~${fmtMD(wk.friday)}) 기준으로 저장됩니다</label></div>
      <div class="week-form-grid">
        <div class="progress-week"><label>프로젝트<span class="req">*</span></label><input type="text" id="wf_project"></div>
        <div class="progress-week"><label>고객사 / 담당자<span class="req">*</span></label><input type="text" id="wf_contact"></div>
        <div class="progress-week"><label>프로젝트 유형<span class="req">*</span></label><select id="wf_type">${projectTypeOptionsHtml("")}</select></div>
        <div class="progress-week"><label>사업 규모(금액)<span class="req">*</span></label><input type="text" id="wf_scale"></div>
        <div class="progress-week"><label>수행 기간<span class="req">*</span></label><div class="timing-range"><input type="month" id="wf_timing_start"><span>~</span><input type="month" id="wf_timing_end"></div></div>
        <div class="progress-week"><label>수주 확도(%)<span class="req">*</span></label><input type="number" id="wf_prob" min="0" max="100" step="5"></div>
      </div>
      <div class="progress-week"><label>주요 일정 및 진행 현황</label><textarea id="wf_status" rows="3"></textarea></div>
      <div class="progress-week"><label>이슈 및 리스크</label><textarea id="wf_issue" rows="2"></textarea></div>
      <div class="progress-week"><label>해결책 및 대안</label><textarea id="wf_solution" rows="2"></textarea></div>
      <div class="progress-actions">
        <span class="progress-status" id="weeklyFormStatus"></span>
        <button type="button" class="btn-cancel" onclick="toggleWeeklyForm('${unitKey}')">취소</button>
        <button type="button" class="btn-save" id="weeklySubmitBtn" onclick="submitWeeklyReport('${unitKey}')">등록</button>
      </div>
    </div>`;
  btn.textContent = "접기";
  container.scrollIntoView({ behavior: "smooth", block: "nearest" });
}

async function submitWeeklyReport(unitKey) {
  const sheetName = WEEKLY_REPORT_SHEETS[unitKey];
  const statusEl = document.getElementById("weeklyFormStatus");
  const btn = document.getElementById("weeklySubmitBtn");
  const fields = collectWeeklyFormFields("wf");
  if (fields.error) {
    statusEl.textContent = fields.error;
    statusEl.className = "progress-status err";
    return;
  }
  const wk = getWeekInfo(new Date());
  const report = {
    year: wk.year, month: wk.month, week: wk.week,
    startDate: isoDate(wk.monday), endDate: isoDate(wk.friday),
    ...fields.values,
    status: document.getElementById("wf_status").value.trim(),
    issue: document.getElementById("wf_issue").value.trim(),
    solution: document.getElementById("wf_solution").value.trim(),
  };
  btn.disabled = true;
  statusEl.textContent = "등록 중…";
  statusEl.className = "progress-status";
  try {
    const res = await fetch(PROGRESS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "append", sheet: sheetName, report }),
    });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "등록 실패");

    delete WEEKLY_CACHE[sheetName]; // 새로 등록됐으니 다음 조회 때 새로 불러오게 캐시 무효화
    statusEl.textContent = "등록됐습니다";
    statusEl.className = "progress-status ok";
    const u = UNITS.find(x => x.key === unitKey);
    if (u) await renderWeeklyPanel(u); // 재렌더링되면서 입력 폼도 자동으로 접힌 상태로 초기화됨
  } catch (err) {
    statusEl.textContent = `등록 실패: ${err.message || err}`;
    statusEl.className = "progress-status err";
    btn.disabled = false;
  }
}

async function saveEditedWeeklyReport(id) {
  const r = weeklyCurrentList.find(x => x.id === id);
  if (!r) return;
  const sheetName = WEEKLY_REPORT_SHEETS[r.unit];
  const statusEl = document.getElementById("weeklyEditStatus");
  const btn = document.getElementById("weeklyEditSaveBtn");
  const fields = collectWeeklyFormFields("we");
  if (fields.error) {
    statusEl.textContent = fields.error;
    statusEl.className = "progress-status err";
    return;
  }
  // 주차/기간(등록 주차)은 편집 대상이 아님 — 처음 등록됐을 때의 주차를 그대로 유지
  const report = {
    year: r.year, month: r.month, week: r.week,
    startDate: isoDate(r.start), endDate: isoDate(r.end),
    ...fields.values,
    status: document.getElementById("we_status").value.trim(),
    issue: document.getElementById("we_issue").value.trim(),
    solution: document.getElementById("we_solution").value.trim(),
  };
  btn.disabled = true;
  statusEl.textContent = "저장 중…";
  statusEl.className = "progress-status";
  try {
    const res = await fetch(PROGRESS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "update", sheet: sheetName, id, report }),
    });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "저장 실패");

    delete WEEKLY_CACHE[sheetName];
    weeklyEditingId = null;
    if (weeklyCurrentUnit) await renderWeeklyPanel(weeklyCurrentUnit);
  } catch (err) {
    statusEl.textContent = `저장 실패: ${err.message || err}`;
    statusEl.className = "progress-status err";
    btn.disabled = false;
  }
}

async function deleteWeeklyReport(id) {
  const r = weeklyCurrentList.find(x => x.id === id);
  if (!r) return;
  if (!confirm(`"${r.project || "이 보고"}" 항목을 삭제하시겠습니까?`)) return;
  const sheetName = WEEKLY_REPORT_SHEETS[r.unit];
  try {
    const res = await fetch(PROGRESS_WEBHOOK_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" },
      body: JSON.stringify({ action: "delete", sheet: sheetName, id }),
    });
    const data = await res.json();
    if (data.status !== "ok") throw new Error(data.message || "삭제 실패");

    delete WEEKLY_CACHE[sheetName];
    if (weeklyCurrentUnit) await renderWeeklyPanel(weeklyCurrentUnit);
  } catch (err) {
    alert(`삭제 실패: ${err.message || err}`);
  }
}

async function init() {
  panelEl.innerHTML = `<div class="panel-title"><h2>불러오는 중…</h2><span class="hint">구글시트에서 최신 데이터를 가져오고 있습니다</span></div>`;
  try {
    await loadLiveData();
    buildTabs();
    selectTab(VIEW ? VIEW.default : "all");
    const now = new Date();
    document.getElementById("dataSource").textContent =
      `구글시트 실시간 연동 · 마지막 갱신 ${now.toLocaleString("ko-KR")}`;
  } catch (err) {
    panelEl.innerHTML = `<div class="panel-title"><h2>데이터를 불러오지 못했습니다</h2><span class="hint">${err.message || err}</span></div>
      <div class="table-card" style="padding:20px;"><button type="button" onclick="init()" style="padding:8px 16px;border-radius:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--ink-900);cursor:pointer;">다시 시도</button></div>`;
    document.getElementById("dataSource").textContent = "구글시트 연동 실패";
  }
}

init();

// ---------- theme toggle ----------
const SUN_ICON = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.6M12 18.9v2.6M4.6 4.6l1.8 1.8M17.6 17.6l1.8 1.8M2.5 12h2.6M18.9 12h2.6M4.6 19.4l1.8-1.8M17.6 6.4l1.8-1.8"/></svg>';
const MOON_ICON = '<svg viewBox="0 0 24 24" fill="currentColor"><path d="M20.4 14.7A8.6 8.6 0 1 1 9.3 3.6a7 7 0 0 0 11.1 11.1z"/></svg>';

const root = document.documentElement;
const toggleBtn = document.getElementById("themeToggle");
const iconEl = document.getElementById("themeIcon");
const labelEl = document.getElementById("themeLabel");
const STORE_KEY = "gs-dashboard-theme";

function systemPrefersDark() {
  return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
}
function applyTheme(mode) {
  root.setAttribute("data-theme", mode);
  const isDark = mode === "dark";
  iconEl.innerHTML = isDark ? MOON_ICON : SUN_ICON;
  labelEl.textContent = isDark ? "다크" : "라이트";
  toggleBtn.setAttribute("aria-pressed", String(isDark));
}
function currentMode() {
  const attr = root.getAttribute("data-theme");
  if (attr === "dark" || attr === "light") return attr;
  return systemPrefersDark() ? "dark" : "light";
}

let saved = null;
try { saved = localStorage.getItem(STORE_KEY); } catch (e) {}
// 저장된 선택이 없으면 시스템 설정과 상관없이 라이트 모드를 기본값으로 시작
applyTheme(saved === "dark" || saved === "light" ? saved : "light");

toggleBtn.addEventListener("click", () => {
  const next = currentMode() === "dark" ? "light" : "dark";
  applyTheme(next);
  try { localStorage.setItem(STORE_KEY, next); } catch (e) {}
});
</script>
